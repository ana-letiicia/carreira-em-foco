<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carreira em Foco</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Planeje sua carreira durante a graduação: objetivos, competências, plano de ação e oportunidades. Projeto de extensão curricular da UNIFAMETRO.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Site com cabeçalho fixo; vitrine em faixas de largura total (verde profundo + papel claro) e área do aluno em cartões. Verde UNIFAMETRO com laranja só nas ações principais. */
:root{
  --verde-950:#00301B; --verde-900:#003D22; --verde-700:#1F6B3F; --verde-500:#3BAA35; --hero-panel:#0F4F30; --laranja:#F29A1F;
  --bg:#F1F6EF; --surface:#FFFFFF; --surface-2:#F3F8F1; --ink:#10261A; --muted:#506558; --line:#D6E2D3;
  --accent:#1F6B3F; --accent-ink:#FFFFFF; --accent-soft:#DDEFD9;
  --warn:#9A4A00; --warn-soft:#FDECCB; --bad:#B42318; --bad-soft:#FBE3E0; --head-bg:rgba(255,255,255,.92);
  --band:#FFFFFF; --shadow:0 1px 2px rgba(0,40,20,.06),0 8px 24px rgba(0,40,20,.06);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1810; --surface:#122619; --surface-2:#183222; --ink:#E8F3E6; --muted:#9BB4A2; --line:#26412E;
  --accent:#5CCB56; --accent-ink:#06210F; --accent-soft:#1E4228; --warn:#F5B450; --warn-soft:#3B2D12; --bad:#FF8F85; --bad-soft:#3D1B18;
  --head-bg:rgba(11,24,16,.92); --band:#0F2016; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1810; --surface:#122619; --surface-2:#183222; --ink:#E8F3E6; --muted:#9BB4A2; --line:#26412E;
  --accent:#5CCB56; --accent-ink:#06210F; --accent-soft:#1E4228; --warn:#F5B450; --warn-soft:#3B2D12; --bad:#FF8F85; --bad-soft:#3D1B18;
  --head-bg:rgba(11,24,16,.92); --band:#0F2016; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:41}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
.top .in{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.15rem;line-height:1;text-decoration:none;color:var(--ink);flex:none}
.nav{display:flex;gap:2px;margin-left:12px;flex:1;min-width:0}
.nav a{padding:8px 9px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:.9rem}
.who .nm{font-weight:700;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savestat{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.savestat i{width:8px;height:8px;border-radius:50%;background:var(--verde-500);display:inline-block}
.savestat.busy i{background:var(--laranja)}
.savestat.err i{background:var(--bad)}

/* botões e formulários */
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--accent-soft);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn.ghost{background:transparent;color:var(--muted);padding:6px 10px;min-height:36px}
.btn.ghost:hover{color:var(--bad)}
.btn.orange{background:var(--laranja);color:#2B1700}
.btn.lg{min-height:52px;padding:12px 26px;font-size:1.05rem;border-radius:14px}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
label{font-weight:700;font-size:.9rem;display:flex;flex-direction:column;gap:5px}
input,select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.stack{display:flex;flex-direction:column;gap:14px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700;font-size:.92rem}

/* vitrine */
.hero{background:radial-gradient(1100px 500px at 85% 10%,#2B7A4B 0%,transparent 60%),linear-gradient(160deg,var(--verde-950),var(--verde-900) 55%,#0F5A33);color:#fff;overflow:hidden}
.hero .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:clamp(40px,8vw,88px)}
.hero .affiliation{align-self:flex-start;border:1px solid rgba(191,233,184,.3);border-radius:999px;padding:6px 12px;color:#BFE9B8;font-weight:700;font-size:.78rem;letter-spacing:.04em}
.hero p.lead{font-size:1.15rem;color:#DDEFD9;max-width:50ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.line{color:#fff}
.focus{position:relative;aspect-ratio:1;max-width:420px;width:100%;margin-inline:auto}
.band{background:var(--band)}
.band .in{padding-block:clamp(36px,6vw,64px);display:flex;flex-direction:column;gap:28px}
.sec-h{display:flex;flex-direction:column;gap:8px;max-width:60ch}
.kicker{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;list-style:none;padding:0;margin:0}
.steps li{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:3px solid var(--verde-500)}
.steps .n{font-family:var(--font-display);font-weight:800;color:var(--laranja);font-size:1.5rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.fact b{font-family:var(--font-display);font-size:2.2rem;line-height:1;color:var(--accent)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.feat div{display:flex;flex-direction:column;gap:6px}
.ico{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta{background:var(--verde-900);color:#fff}
.cta .in{padding-block:48px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer .in{padding-block:24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}

/* autenticação */
.auth{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.auth .side{background:linear-gradient(160deg,var(--verde-950),var(--verde-700));color:#fff;padding:36px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.auth .side p{color:#DDEFD9}
.auth .form-side{background:var(--surface);padding:32px;display:flex;flex-direction:column;gap:16px}
.back{align-self:flex-start;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--muted);padding:6px 0}
.back:hover{color:var(--accent)}
.gbtn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);min-height:52px;width:100%;border-radius:12px;font-size:1rem;transition:box-shadow .2s,border-color .2s}
.gbtn:hover,.gslot:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);filter:none}
.gbtn svg{width:20px;height:20px;flex:none}
.gslot{border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);min-height:52px;display:flex;align-items:center;justify-content:center;padding:3px;transition:box-shadow .2s,border-color .2s;overflow:hidden}
.gnote{text-align:center;color:var(--muted);font-size:.8rem;margin-top:-6px}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.sep::before,.sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.tabs a{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:700;text-decoration:none;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* área do aluno */
.main{padding-block:28px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:6px}
.head h1{font-size:clamp(1.7rem,3.5vw,2.3rem)}
.head p{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;background:var(--accent-soft);color:var(--ink);border:0}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{cursor:pointer;min-height:32px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:38px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{height:10px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--verde-500);border-radius:999px;transition:width .4s}
.greet{background:linear-gradient(135deg,var(--verde-900),var(--verde-700));color:#fff;border-radius:22px;padding:clamp(20px,4vw,32px);display:flex;gap:28px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.greet h1{color:#fff}
.greet p{color:#DDEFD9}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--font-display);font-size:1.9rem;line-height:1}
.stat span{font-size:.82rem;color:#CFE8CB}
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:12px;min-width:0;flex-wrap:wrap}
.item .t{flex:1;min-width:140px;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:2px solid var(--accent);background:var(--surface);color:var(--accent-ink);cursor:pointer;flex:none;padding:0}
.check:hover{background:var(--accent-soft)}
.check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-checked="true"]{background:var(--accent)}
.check[aria-checked="true"] svg{opacity:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;align-items:center}
.dots{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{background:var(--accent)}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--laranja);border-color:var(--laranja);color:#2B1700}
.hbar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 36px;gap:10px;align-items:center;font-size:.9rem}
.hbar .bar{height:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--font-display);font-size:1.9rem;line-height:1.1}
blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--verde-500);background:var(--surface-2);border-radius:0 10px 10px 0;overflow-wrap:anywhere}

.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav a{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);text-decoration:none;font-weight:700;color:var(--muted);background:var(--surface);font-size:.92rem}
.subnav a:hover{color:var(--ink)}
.subnav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.main>.wrap+.wrap{margin-top:20px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:14px;background:var(--surface-2);border:1.5px dashed var(--line);color:var(--muted)}
.badge .bi{font-size:1.4rem;line-height:1}
.badge.on{border:1.5px solid var(--laranja);background:var(--warn-soft);color:var(--ink)}
.badge.on .bi{color:var(--laranja)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--verde-500);display:flex;flex-direction:column;gap:12px}
.tl-i{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;position:relative}
.tl-i::before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--verde-500)}
.tl-i.goal::before{background:var(--laranja);width:13px;height:13px;left:-24px}
.tl-i.done .t{text-decoration:line-through;color:var(--muted)}
.tl-d{font-weight:800;font-family:var(--font-display);min-width:46px}
.cvdoc{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:24px;font-family:Calibri,Arial,sans-serif;font-size:.92rem;overflow-wrap:anywhere}
.cvdoc h1{font-size:1.6rem;color:#111}.cvdoc h2{font-size:.95rem;border-bottom:1px solid var(--verde-700);color:var(--verde-700);margin:14px 0 4px}
.cvdoc ul{margin:0;padding-left:18px}.cvdoc .cv-c{color:#444}
.cvgrid{align-items:start}
@media print{body *{visibility:hidden}#cv,#cv *{visibility:visible}#cv{position:absolute;left:0;top:0;width:100%;border:0;padding:0}}
.tabbar{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

@media (max-width:1180px){
  .nav{display:none}
  .who .nm{display:none}
  .hero .in,.auth,.grid2{grid-template-columns:minmax(0,1fr)}
  .focus{max-width:300px}
  .main{padding-bottom:56px}
  .tabbar{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:39;background:var(--head-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.66rem;font-weight:700;padding:6px 2px;border-radius:10px;min-width:0;flex:1}
  .tabbar a svg{stroke:currentColor;width:22px;height:22px}
  .tabbar a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
  .auth .side{padding:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Vitrine: ilustração de foco e metas com cartões de progresso. */
::selection{background:var(--accent);color:var(--accent-ink)}
input,textarea{caret-color:var(--accent)}
a{text-underline-offset:.18em}
.hero .in{max-width:1200px;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);gap:clamp(40px,4vw,56px);min-height:570px}
.hero h1{max-width:20ch;font-size:clamp(3rem,4.2vw,4rem);line-height:1.03;letter-spacing:-.035em}
.hero p.lead{max-width:42ch}
.hero .ctas .btn{transition:filter .2s,transform .2s}
.hero .ctas .btn:hover{transform:translateY(-2px)}
.focus.target-art{display:grid;place-items:center;max-width:460px;overflow:visible}
.target-art svg{position:absolute;inset:2%;width:96%;height:96%;overflow:visible}
.target-art svg.guest-symbol{inset:auto;width:76%;height:76%}
.target-ring{fill:none;stroke:#24743D;stroke-width:2}
.target-ring.inner{stroke:#3BAA35;stroke-width:3}
.target-core{fill:#38AE37}
.target-center{fill:var(--laranja)}
.target-mark{stroke:#BFE9B8;stroke-width:3;stroke-linecap:round}
.float{position:absolute;z-index:2;width:46%;padding:12px 14px;border-radius:16px;background:#10261A;color:#fff;box-shadow:0 16px 36px rgba(0,0,0,.24)}
.float.a{top:8%;right:0}
.float.b{bottom:8%;left:0}
.float strong{display:block;overflow-wrap:anywhere;font-family:var(--font-display);font-size:clamp(.82rem,1.15vw,1rem);line-height:1.2}
.float p{margin:8px 0 6px;color:#9BB4A2;font-size:clamp(.72rem,.95vw,.86rem);line-height:1.35}
.skill-dots{display:flex;gap:4px}
.skill-dots i{width:22px;height:22px;border:2px solid #3BAA35;border-radius:50%}
.skill-dots i.filled{background:#5ACB52}
.mini-progress{height:9px;margin:7px 0 5px;border-radius:999px;background:#234630;overflow:hidden}
.mini-progress i{display:block;width:60%;height:100%;border-radius:inherit;background:#3BAA35}
.float.b p{margin:0;color:#9BB4A2}
.facts{gap:0;margin-top:10px;border-block:1px solid var(--line)}
.fact{min-height:158px;justify-content:center;padding:22px clamp(16px,2.2vw,30px);border:0;border-radius:0;background:transparent;box-shadow:none}
.fact:not(:last-child){border-right:1px solid var(--line)}

var ArtB={kind:"artifact",senha:false,temVagas:true,temMentoria:true,db:null,uid:null,isAdmin:false,
  setup:function(){
    var self=this;

      if(!r[0]||!r[1])return false;
      return r[1].id().then(function(id){
        if(!id)return false;
        self.db=r[0];self.uid=id;
        return Promise.resolve(r[1].canEdit()).then(function(a){self.isAdmin=!!a;return true});
      });
    }).catch(function(){return false});
  },
  ref:function(){return this.db.doc("data/users/"+this.uid+"/estado")},
  init:function(){var self=this;return this.ref().get().then(function(d){if(!d.exists)return self.isAdmin?{nome:"Coordena\u00e7\u00e3o",admin:true}:null;self._s=d.data();return {nome:self._s.profile.nome,admin:self.isAdmin}})},
  entrar:function(f){if(this._s&&this._s.profile)return Promise.resolve({nome:this._s.profile.nome,admin:this.isAdmin});this._s=emptyState(f);var self=this;return this.save(this._s).then(function(){return {nome:f.nome,admin:self.isAdmin}})},
  criar:function(f){return this.entrar(f)},
  sair:function(){return Promise.resolve()},
  load:function(){return Promise.resolve(this._s||null)},
  save:function(s){

  },
  admin:function(){return this.db.collection("resumo").get().then(function(q){return q.docs.map(function(d){return d.data()})})},
  vagas:function(){return this.db.collection("vagas").get().then(function(q){var t=today();return docsComId(q).filter(function(v){return !v.prazo||v.prazo>=t}).sort(function(a,b){return String(b.criado||"").localeCompare(String(a.criado||""))})})},
  adminVagas:function(){return this.db.collection("vagas").get().then(function(q){return docsComId(q).sort(function(a,b){return String(b.criado||"").localeCompare(String(a.criado||""))})})},
  adminVagaCriar:function(v){
    if(["Est\u00e1gio","Vaga","Curso","Evento"].indexOf(v.tipo)<0)return Promise.reject(new Error("Escolha o tipo."));

    return this.db.collection("vagas").add({tipo:v.tipo,titulo:v.titulo.slice(0,120),empresa:(v.empresa||"").slice(0,120),descricao:(v.descricao||"").slice(0,600),link:v.link||"",prazo:v.prazo||"",criado:new Date().toISOString()});
  },
  adminVagaExcluir:function(id){return this.db.doc("vagas/"+id).delete()},
  mentorias:function(){return this.db.collection("mentorias/"+this.uid+"/pedidos").get().then(function(q){return docsComId(q).sort(function(a,b){return String(b.criado_em).localeCompare(String(a.criado_em))})})},
  mentoriaCriar:function(f){
    var self=this;

      if(l.filter(function(m){return m.status!=="concluida"}).length>=3)throw new Error("Voc\u00ea j\u00e1 tem 3 pedidos em aberto. Aguarde a resposta da coordena\u00e7\u00e3o.");
      if(!f.mensagem||f.mensagem.length<10)throw new Error("Conte um pouco mais sobre o que voc\u00ea precisa (m\u00ednimo de 10 caracteres).");
      var p=S.profile,agora=new Date().toISOString();

      });
    });
  },
  adminMentorias:function(){
    var self=this;
    return this.db.collection("mentorias").get().then(function(q){
      return Promise.all(q.docs.map(function(d){var a=d.data();return self.db.collection("mentorias/"+d.id+"/pedidos").get().then(function(pq){return pq.docs.map(function(x){return Object.assign({id:d.id+"/"+x.id,email:"",nome:a.nome,curso:a.curso,semestre:a.semestre},x.data())})})})).then(function(ls){

var MESES=["janeiro","fevereiro","mar\u00e7o","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function semDe(g){return (S.extra.sem||{})[g.id]||""}
function vLinha(){
  var modo=window.__tl||"mes",ev=[];
  S.goals.forEach(function(g){ev.push({k:"g",d:g.data||"",t:g.titulo,s:semDe(g),g:g,prazo:PRAZO[g.prazo],q:pct(g)})});
  S.tasks.forEach(function(t){var g=find(S.goals,t.goalId);ev.push({k:"t",d:t.data||"",t:t.titulo,s:g?semDe(g):"",st:t.status,late:overdue(t),gt:g?g.titulo:""})});
  var h='<div class="wrap"><div class="head"><h1>Linha do tempo</h1><p>Veja seus objetivos e tarefas em ordem de data ou organizados por semestre.</p></div>';
  h+='<div class="pills" role="group" aria-label="Modo de exibi\u00e7\u00e3o"><button class="pill" data-act="tl-modo" data-v="mes" aria-pressed="'+(modo==="mes")+'">Por m\u00eas</button><button class="pill" data-act="tl-modo" data-v="sem" aria-pressed="'+(modo==="sem")+'">Por semestre</button></div>';
  if(!ev.length)return h+'<div class="empty"><b>Nada para mostrar ainda.</b><span>Crie objetivos e tarefas com datas no plano de a\u00e7\u00e3o.</span><a class="btn orange" href="#planodeacao">Ir para o plano de a\u00e7\u00e3o</a></div></div>';
  var grupos={},ordem=[];
  ev.forEach(function(e){
    var k,lab;
    if(modo==="sem"){k=e.s||"~";lab=e.s||"Sem semestre definido"}
    else if(e.d){k=e.d.slice(0,7);lab=MESES[+k.slice(5,7)-1]+" de "+k.slice(0,4)}
    else{k="~";lab="Sem data"}
    if(!grupos[k]){grupos[k]={lab:lab,l:[]};ordem.push(k)}
    grupos[k].l.push(e);
  });
  if(modo==="sem")ordem.sort(function(a,b){var ia=SEMESTRES.indexOf(a),ib=SEMESTRES.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  else ordem.sort();
  if(modo==="sem")h+='<p class="muted small">Dica: escolha o semestre de cada objetivo na lista abaixo. As tarefas acompanham o objetivo.</p>';
  ordem.forEach(function(k){
    var gr=grupos[k];gr.l.sort(function(a,b){return (a.d||"9999").localeCompare(b.d||"9999")||(a.k==="g"?-1:1)});
    h+='<section class="card"><h2 style="text-transform:capitalize">'+esc(gr.lab)+'</h2><ol class="tl">';
    gr.l.forEach(function(e){
      if(e.k==="g"){
        h+='<li class="tl-i goal"><span class="tl-d">'+(e.d?fmt(e.d).slice(0,5):"\u2013")+'</span><div class="stack" style="gap:6px;flex:1;min-width:0"><div class="row between"><b>'+esc(e.t)+'</b><span class="chip">'+e.prazo+'</span></div><div class="bar" aria-hidden="true"><i style="width:'+e.q+'%"></i></div><span class="small muted">'+e.q+'% conclu\u00eddo</span>'+(modo==="sem"?'<label class="small" for="sg-'+e.g.id+'">Semestre alvo<select id="sg-'+e.g.id+'" data-semgoal="'+e.g.id+'"><option value="">Sem semestre</option>'+SEMESTRES.map(function(x){return '<option'+(x===e.s?" selected":"")+'>'+x+'</option>'}).join("")+'</select></label>':'')+'</div></li>';
      }else{
        h+='<li class="tl-i'+(e.st==="done"?" done":"")+'"><span class="tl-d">'+(e.d?fmt(e.d).slice(0,5):"\u2013")+'</span><div style="flex:1;min-width:0"><span class="t">'+esc(e.t)+'</span><br><span class="small muted">'+esc(e.gt)+' \u00b7 '+statusLabel(e.st)+'</span></div>'+(e.late?'<span class="chip bad">Atrasada</span>':'')+'</li>';
      }
    });
    h+='</ol></section>';
  });
  return h+'</div>';
}

function textoRelatorio(){
  var rows=window.__rows||[],a=window.__ativ||{},t=a.totais||{},n=rows.length;
  var soma=function(k){return rows.reduce(function(x,r){return x+(r[k]||0)},0)};
  var tar=soma("tarefas"),con=soma("concluidas"),atr=soma("atrasadas"),comObj=rows.filter(function(r){return r.objetivos>0}).length;
  var logins=(t.login||0)+(t.login_google||0)+(t.login_microsoft||0);
  var cursos={};rows.forEach(function(r){var c=r.curso||"N\u00e3o informado";cursos[c]=(cursos[c]||0)+1});
  var cl=Object.keys(cursos).sort(function(x,y){return cursos[y]-cursos[x]}).slice(0,6).map(function(c){return c+" ("+cursos[c]+")"}).join("; ");
  var L=[];
  L.push("RESULTADOS DA A\u00c7\u00c3O: SISTEMA CARREIRA EM FOCO");
  L.push("Dados extra\u00eddos do pr\u00f3prio sistema em "+fmt(today())+(a.periodo&&a.periodo.inicio?", cobrindo o uso registrado de "+fmt(a.periodo.inicio)+" a "+fmt(a.periodo.fim)+".":"."));
  L.push("");
  L.push("Participa\u00e7\u00e3o: "+pl(n,"estudante cadastrado","estudantes cadastrados")+(cl?". Cursos: "+cl:"")+".");
  if(logins)L.push("Foram registrados "+logins+" acessos (logins) ao sistema.");
  L.push("Uso do plano de a\u00e7\u00e3o: "+comObj+" de "+n+" estudantes ("+pc(comObj,n)+"%) criaram ao menos um objetivo. Foram criadas "+tar+" tarefas, das quais "+con+" ("+pc(con,tar)+"%) foram conclu\u00eddas e "+atr+" est\u00e3o atrasadas.");
  var ex=[];
  if(t.teste_concluido)ex.push(pl(t.teste_concluido,"teste de perfil conclu\u00eddo","testes de perfil conclu\u00eddos"));
  if(t.curriculo_gerado)ex.push(pl(t.curriculo_gerado,"curr\u00edculo gerado","curr\u00edculos gerados"));
  if(t.vaga_aberta)ex.push(pl(t.vaga_aberta,"abertura de vaga divulgada pela coordena\u00e7\u00e3o","aberturas de vagas divulgadas pela coordena\u00e7\u00e3o"));
  if(t.oportunidade_aberta)ex.push(pl(t.oportunidade_aberta,"site de oportunidade aberto","sites de oportunidades abertos"));
  if(t.mentoria_pedida)ex.push(pl(t.mentoria_pedida,"pedido de mentoria","pedidos de mentoria"));
  if(ex.length)L.push("Recursos utilizados: "+ex.join("; ")+".");
  if(a.mentorias&&a.mentorias.length)L.push("Situa\u00e7\u00e3o das mentorias: "+a.mentorias.map(function(m){return m.n+" "+(ST_M[m.status]||m.status).toLowerCase()}).join(", ")+".");
  if(typeof a.vagas==="number")L.push("Vagas e eventos ativos divulgados: "+a.vagas+".");
  var av=rows.filter(function(r){return r.util>0}).length;
  if(av)L.push("Avalia\u00e7\u00e3o do sistema (m\u00e9dia de 1 a 5, "+pl(av,"resposta","respostas")+"): ajuda a organizar a carreira "+f1(avg(rows,"util"))+"; f\u00e1cil de usar "+f1(avg(rows,"facil"))+"; usaria durante a gradua\u00e7\u00e3o "+f1(avg(rows,"voltar"))+".");
  else L.push("Avalia\u00e7\u00e3o do sistema: ainda sem respostas.");
  var cm=rows.filter(function(r){return r.comentario}).slice(0,5);
  if(cm.length){L.push("");L.push("Sugest\u00f5es dos estudantes:");cm.forEach(function(r){L.push("- "+r.comentario+" ("+(r.curso||"curso n\u00e3o informado")+")")})}
  L.push("");L.push("Observa\u00e7\u00e3o: complemente este texto com a an\u00e1lise da equipe e com os registros presenciais da a\u00e7\u00e3o.");
  return L.join("\n");
}

  if(a==="sair"){flush().then(function(){return B.sair()}).then(function(){irLogin();USER=null;S=null;lastCompletedTaskId=null;window.__rows=null;window.__ativ=null;location.hash="inicio";render();toast("Voc\u00ea saiu da conta")});return}
  if(extraAct(a,b,id))return;
  if(a==="toggle"){var t=find(S.tasks,id);t.status=t.status==="done"?"todo":"done";if(t.status==="done"){lastCompletedTaskId=t.id;track("tarefa_concluida")}else if(lastCompletedTaskId===t.id)lastCompletedTaskId=null;toast(t.status==="done"?"Tarefa conclu\u00edda":"Tarefa reaberta")}
  else if(a==="cycle"){var t2=find(S.tasks,id);var i=STATUS.map(function(x){return x[0]}).indexOf(t2.status);t2.status=STATUS[(i+1)%3][0];if(t2.status==="done")track("tarefa_concluida")}
  else if(a==="del-task"){S.tasks=S.tasks.filter(function(x){return x.id!==id});toast("Tarefa exclu\u00edda")}
  else if(a==="del-goal"){S.goals=S.goals.filter(function(x){return x.id!==id});S.tasks=S.tasks.filter(function(x){return x.goalId!==id});if(S.extra.sem)delete S.extra.sem[id];toast("Objetivo exclu\u00eddo")}
  else if(a==="filter"){window.__f=b.getAttribute("data-v")}
  else if(a==="ofilter"){window.__o=b.getAttribute("data-v")}
  else if(a==="level"){find(S.skills,id).nivel=+b.getAttribute("data-n")}
  else if(a==="del-skill"){S.skills=S.skills.filter(function(x){return x.id!==id})}
  else if(a==="sug"){S.skills.push({id:uid(),kind:b.getAttribute("data-kind"),nome:b.getAttribute("data-nome"),nivel:1})}
  else if(a==="modelo"){track("modelo_usado");modelo();toast("Modelo adicionado. Edite como quiser.")}
  else if(a==="opp-task"){var o=OPPS[+b.getAttribute("data-i")],g=oppGoal();track("oportunidade_tarefa",o.n);S.tasks.push({id:uid(),goalId:g.id,titulo:"Conhecer "+o.n+" ("+o.t.toLowerCase()+")",data:plusDays(14),status:"todo"});toast("Tarefa criada no plano de a\u00e7\u00e3o")}
  else if(a==="rate"){track("avaliacao_nota",b.getAttribute("data-q"));S.feedback[b.getAttribute("data-q")]=+b.getAttribute("data-n")}
  checkConquistas();save();render();
});
document.addEventListener("submit",function(e){
  var f=e.target,k=f.getAttribute("data-form");if(!k)return;e.preventDefault();
  var d=new FormData(f),o={};d.forEach(function(v,key){o[key]=typeof v==="string"?v.trim():v});
  if(extraSubmit(k,o,f))return;
  if(k==="auth"){
    var errEl=document.getElementById("auth-err");
    var fail=function(m){errEl.textContent=m;errEl.hidden=false};
    var modo=f.getAttribute("data-modo");
    if(modo==="criar"&&B.senha&&!/^\S{2,}(\s+\S+)+$/.test(o.nome||""))return fail("Informe seu nome completo (nome e sobrenome).");
    if(modo==="criar"&&!B.senha&&(!o.nome||!o.curso))return fail("Preencha nome e curso.");
    if(B.senha&&(!o.email||!o.senha))return fail("Preencha e-mail e senha.");
    if(B.senha&&modo==="criar"&&o.senha.length<8)return fail("A senha precisa ter pelo menos 8 caracteres.");
    if(B.senha&&modo==="criar"&&o.senha!==o.senha2)return fail("As senhas n\u00e3o s\u00e3o iguais.");
    var btn=f.querySelector("button[type=submit]");btn.disabled=true;
    (modo==="entrar"?B.entrar(o):B.criar(o)).then(function(u){
      USER=u;return B.load().then(function(s){setS(s,o);marcarDia();location.hash="painel";render()});
    }).catch(function(er){btn.disabled=false;fail(er.message||"N\u00e3o foi poss\u00edvel entrar.")});
    return;
  }
  if(k==="completar"){if(!o.curso)return;S.profile.curso=o.curso;S.profile.semestre=o.semestre;save();location.hash="painel";render();return}
  if(k==="goal"){track("objetivo_criado");var gid=uid();S.goals.push({id:gid,titulo:o.titulo,prazo:o.prazo,data:o.data||""});if(o.sem){S.extra.sem=S.extra.sem||{};S.extra.sem[gid]=o.sem}toast("Objetivo adicionado")}
  if(k==="task"){track("tarefa_criada");S.tasks.push({id:uid(),goalId:f.getAttribute("data-goal"),titulo:o.titulo,data:o.data||"",status:"todo"});toast("Tarefa adicionada")}
  if(k==="skill"){track("competencia_adicionada",f.getAttribute("data-kind"));S.skills.push({id:uid(),kind:f.getAttribute("data-kind"),nome:o.nome,nivel:1})}
  checkConquistas();save();render();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.hasAttribute("data-field")){S.profile[t.getAttribute("data-field")]=t.value;save()}
  if(t.hasAttribute("data-cv")){S.extra.cv=S.extra.cv||{};S.extra.cv[t.getAttribute("data-cv")]=t.value;var cv=document.getElementById("cv");if(cv)cv.innerHTML=cvHtml();save()}
  if(t.hasAttribute("data-semgoal")){S.extra.sem=S.extra.sem||{};S.extra.sem[t.getAttribute("data-semgoal")]=t.value;save();render()}
  if(t.hasAttribute("data-fbtext")){S.feedback.texto=t.value;save()}
});

/* ================= in\u00edcio ================= */
function start(){
  var pick;
  if(window.claude&&typeof claude.use==="function"){
    pick=ArtB.setup().then(function(ok){return ok?ArtB:LocalB});
  }else if(document.documentElement.getAttribute("data-api")==="enabled"){
    window.__servidor=true;
    pick=ApiB.config().then(function(c){window.__googleId=c.googleClientId||"";window.__msId=c.microsoftClientId||"";window.__msTenant=c.microsoftTenant||"";window.__emailAtivo=!!c.emailAtivo;return ApiB},function(){return LocalB});
  }else{
    pick=Promise.resolve(LocalB);
  }
  pick.then(function(b){
    B=b;
    return B.init().then(function(u){
      USER=u;
      if(!u)return;
      return B.load().then(function(s){setS(s,{nome:u.nome});if(!s)USER.semEstado=true});
    });
  }).then(function(){return msFinal()}).then(function(){if(USER&&!S)setS(null,{nome:USER.nome});if(USER)marcarDia();render()},function(){render()});
}
start();
})();
</script>
